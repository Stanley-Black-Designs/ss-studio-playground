<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Logo Marquee — SS Studio</title>
<link rel="stylesheet" href="demo-chrome.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e8e5e0;
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 50px;
    overflow: hidden;
  }

  /* ---- MARQUEE ---- */
  .marquee-section {
    width: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    /* vertical offset: bottom row sits lower */
    padding: 20px 0 80px;
  }

  .marquee-track {
    display: flex;
    gap: 1.25rem;
    animation: marquee 32s linear infinite;
    will-change: transform;
  }
  .marquee-track.reverse {
    animation-direction: reverse;
    animation-duration: 28s;
  }
  .marquee-section:hover .marquee-track { animation-play-state: paused; }

  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* bubble */
  .bubble {
    flex-shrink: 0;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(230,228,224,0.85);
    border: 1.5px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s, background 0.2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .bubble:hover {
    transform: scale(1.12);
    box-shadow: 0 12px 36px rgba(0,0,0,0.12);
    background: #fff;
  }

  /* logo SVG container */
  .bubble-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 70%;
    height: 70%;
    fill: #111;
    color: #111;
  }
  .bubble-logo svg, .bubble-logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* text logos */
  .bubble-logo.text {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    color: #111;
  }

  /* cursor hint */
  .cursor-hint {
    position: absolute;
    /* positioned relative to bubbles via JS */
    pointer-events: none;
    font-size: 0.75rem;
    color: rgba(0,0,0,0.4);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<header class="demo-chrome">
  <div class="demo-chrome__left">
    <a href="../index.html" class="demo-chrome__back">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Playground
    </a>
    <span class="demo-chrome__sep"></span>
    <span class="demo-chrome__title">Bubble Logo Marquee</span>
  </div>
  <a href="https://calendly.com/stanleysmithstudios/30min" target="_blank" class="demo-chrome__cta">
    Book a call
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>

<!-- Row 1 -->
<div class="marquee-section">
  <div class="marquee-track" id="track1"></div>
</div>

<script>
const logos = [
  // Snapchat ghost
  { label: 'Snapchat', svg: `<svg viewBox="0 0 24 24" fill="#111"><path d="M12.206.793c.99 0 4.347.274 5.93 3.821.529 1.193.403 3.219.317 4.225l-.004.04c-.012.13-.026.26-.034.39.25.127.609.225 1.07.225.27 0 .569-.036.868-.097.342-.07.683-.105 1.019-.105.74 0 1.503.192 1.749.857.307.833-.069 1.5-.749 1.873-.126.067-.267.13-.415.193-.357.15-.812.34-1.158.7-.162.17-.221.347-.15.568.65 2.105 3.019 5.3 6.469 6.328.362.104.483.376.483.641 0 .665-.747 1.458-2.578 1.866-.126.028-.223.144-.286.343-.056.17-.103.347-.167.465-.178.328-.489.498-.882.498-.283 0-.54-.089-.748-.188l-.121-.053c-.438-.183-.91-.388-1.554-.388-.52 0-1.03.143-1.558.462-.736.435-1.55.645-2.4.645-.85 0-1.666-.21-2.4-.645-.527-.32-1.038-.462-1.558-.462-.643 0-1.115.205-1.553.388l-.122.053c-.208.1-.465.188-.748.188-.393 0-.704-.17-.882-.498-.064-.118-.11-.295-.168-.465-.063-.2-.16-.315-.285-.343-1.832-.408-2.578-1.2-2.578-1.866 0-.265.12-.537.483-.641 3.45-1.028 5.819-4.223 6.469-6.328.07-.221.012-.397-.15-.568-.346-.36-.8-.55-1.158-.7-.148-.063-.29-.126-.415-.193-.68-.373-1.056-1.04-.748-1.873.246-.665 1.008-.857 1.748-.857.337 0 .677.035 1.02.105.298.06.597.097.867.097.461 0 .82-.098 1.07-.225l-.035-.43c-.085-1.006-.21-3.032.317-4.225C7.859 1.067 11.215.793 12.206.793z"/></svg>` },
  // Webflow W
  { label: 'Webflow', svg: `<svg viewBox="0 0 120 40" fill="none"><text x="0" y="32" font-family="sans-serif" font-weight="800" font-size="28" fill="#111">𝐖 Webflow</text></svg>`, isText: true, text: 'Webflow' },
  // Asterisk / generic
  { label: 'Perplexity', isIcon: true, icon: '*' },
  // Asana
  { label: 'Asana', isText: true, text: 'asana', logo: 'asana' },
  // Behance
  { label: 'Behance', isText: true, text: 'Bēhance' },
  // Twitter
  { label: 'Twitter', svg: `<svg viewBox="0 0 24 24" fill="#111"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>` },
  // CodePen
  { label: 'CodePen', svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.5"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/><polyline points="2 15.5 12 8.5 22 15.5"/><line x1="12" y1="2" x2="12" y2="8.5"/></svg>` },
  // Figma
  { label: 'Figma', svg: `<svg viewBox="0 0 38 57" fill="none"><path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z" fill="#1abcfe"/><path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 0 1-19 0z" fill="#0acf83"/><path d="M19 0v19h9.5a9.5 9.5 0 0 0 0-19H19z" fill="#ff7262"/><path d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z" fill="#f24e1e"/><path d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z" fill="#a259ff"/></svg>` },
];

function buildBubble(l) {
  const el = document.createElement('div');
  el.className = 'bubble';
  if (l.svg) {
    el.innerHTML = `<div class="bubble-logo">${l.svg}</div>`;
  } else if (l.isIcon) {
    el.innerHTML = `<div class="bubble-logo text" style="font-size:3rem;font-weight:300;">${l.icon}</div>`;
  } else if (l.isText) {
    el.innerHTML = `<div class="bubble-logo text">${l.text}</div>`;
  }
  return el;
}

const track1 = document.getElementById('track1');
// Duplicate for seamless loop
const allLogos = [...logos, ...logos];
allLogos.forEach(l => track1.appendChild(buildBubble(l)));

// Add cursor icon SVG after 3rd bubble in first row
const cursorSvg = `<svg viewBox="0 0 38 52" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l15 38 6-13 14-3L2 2z"/></svg>`;
const cursorEl = document.createElement('div');
cursorEl.style.cssText = 'flex-shrink:0;width:42px;height:52px;display:flex;align-items:center;justify-content:center;opacity:0.45;margin-top:60px;';
cursorEl.innerHTML = cursorSvg;
track1.insertBefore(cursorEl, track1.children[2]);
</script>
</body>
</html>
