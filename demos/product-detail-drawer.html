<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail Drawer — SS Studio</title>
<link rel="stylesheet" href="demo-chrome.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --text: #f0f0f2;
    --muted: rgba(240,240,242,0.42);
    --accent: #0064E7;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    background: #b8c4a8;
    color: #1a1a1a;
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    padding-top: 50px;
  }

  /* ---- PRODUCT GRID ---- */
  .scene {
    min-height: calc(100vh - 50px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    position: relative;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
    max-width: 860px;
    width: 100%;
  }

  .product-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(12px);
    border-radius: 1.25rem;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .product-card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
  }

  .card-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: #d8d8d0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }

  .card-img svg { opacity: 0.25; }

  .card-body { padding: 1rem 1.1rem 1.2rem; }
  .card-body h3 {
    font-size: 0.95rem;
    font-weight: 600;
    color: #111;
    margin-bottom: 0.25rem;
    letter-spacing: -0.01em;
  }
  .card-body span {
    font-size: 0.85rem;
    color: rgba(0,0,0,0.5);
  }

  /* ---- DRAWER ---- */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    z-index: 100;
    pointer-events: none;
    transition: background 0.35s;
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: background 0.35s, backdrop-filter 0.35s;
  }
  .drawer-overlay.open {
    background: rgba(0,0,0,0.3);
    pointer-events: auto;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .drawer {
    position: fixed;
    right: 0;
    top: 50px;
    bottom: 0;
    width: min(440px, 92vw);
    background: #faf9f7;
    border-radius: 1.5rem 0 0 1.5rem;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
    z-index: 200;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: -8px 0 40px rgba(0,0,0,0.15);
  }
  .drawer.open {
    transform: translateX(0);
  }

  .drawer-img-wrap {
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    background: #e8e5e0;
    border-radius: 1.25rem;
    margin: 1rem 1rem 0;
    width: calc(100% - 2rem);
  }

  .drawer-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s cubic-bezier(0.32,0.72,0,1);
  }
  .drawer.open .drawer-img-wrap img { transform: scale(1); }

  .close-btn {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: transform 0.2s, background 0.2s;
    z-index: 10;
  }
  .close-btn:hover { transform: scale(1.1); background: #fff; }

  .drawer-body {
    padding: 1.5rem 1.5rem 1rem;
    flex: 1;
    overflow-y: auto;
  }

  .drawer-body h2 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111;
    line-height: 1.25;
    margin-bottom: 1rem;
    letter-spacing: -0.025em;
  }

  .drawer-body p {
    font-size: 0.9rem;
    line-height: 1.7;
    color: rgba(0,0,0,0.55);
    margin-bottom: 0.85rem;
  }

  /* nav dots + arrows */
  .drawer-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem 1.5rem;
    border-top: 1px solid rgba(0,0,0,0.07);
  }

  .arrow-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.15);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .arrow-btn:hover { background: #111; border-color: #111; color: #fff; transform: scale(1.05); }
  .arrow-btn.dark { background: #111; border-color: #111; color: #fff; }

  .dot-nav {
    display: flex;
    gap: 0.45rem;
    align-items: center;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(0,0,0,0.18);
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active { background: #111; transform: scale(1.3); }
</style>
</head>
<body>

<header class="demo-chrome">
  <div class="demo-chrome__left">
    <a href="../index.html" class="demo-chrome__back">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Playground
    </a>
    <span class="demo-chrome__sep"></span>
    <span class="demo-chrome__title">Product Detail Drawer</span>
  </div>
  <a href="https://calendly.com/stanleysmithstudios/30min" target="_blank" class="demo-chrome__cta">
    Book a call
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>

<div class="scene">
  <div class="product-grid" id="productGrid">
    <!-- cards injected by JS -->
  </div>
</div>

<!-- Drawer -->
<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-img-wrap">
    <button class="close-btn" id="closeBtn">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <img id="drawerImg" src="" alt="">
  </div>
  <div class="drawer-body">
    <h2 id="drawerTitle"></h2>
    <p id="drawerBody1"></p>
    <p id="drawerBody2"></p>
  </div>
  <div class="drawer-footer">
    <button class="arrow-btn" id="prevBtn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 4L6 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="dot-nav" id="dotNav"></div>
    <button class="arrow-btn dark" id="nextBtn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<script>
const products = [
  {
    emoji: '🚲',
    color: '#c8d4ba',
    title: 'Power that feels natural, not electric',
    body1: 'The compact mid-drive system delivers assistance directly through the drivetrain for smooth acceleration and responsive handling.',
    body2: "Its low, central position keeps weight where it belongs, helping the bike feel balanced and predictable whether assistance is active or not.",
    tag: 'Mid-Drive Motor'
  },
  {
    emoji: '⚡',
    color: '#b8c8e0',
    title: 'Range that goes the distance',
    body1: 'A 500Wh battery integrated into the down tube delivers up to 120km of range — enough for the commute, the weekend ride, and everything between.',
    body2: 'The battery charges to 80% in under two hours, and swaps out in seconds when you need to go further.',
    tag: 'Battery System'
  },
  {
    emoji: '🎯',
    color: '#e0d4c8',
    title: 'Precision that responds to you',
    body1: 'Torque sensors in the crank measure your input 1,000 times per second — the motor responds before you notice the hill.',
    body2: 'Five assist levels let you dial in exactly how much help you want, from a gentle nudge to full power mode.',
    tag: 'Smart Assist'
  },
  {
    emoji: '🛞',
    color: '#d4c8e0',
    title: 'Geometry built for real roads',
    body1: 'A relaxed head-tube angle and wide bars give you control without fatigue — this is a bike you can ride for hours.',
    body2: 'Hydraulic disc brakes with 180mm rotors front and rear stop you confidently in every condition.',
    tag: 'Frame & Geometry'
  },
];

const grid = document.getElementById('productGrid');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');
const dotNav = document.getElementById('dotNav');
const drawerImg = document.getElementById('drawerImg');
const drawerTitle = document.getElementById('drawerTitle');
const drawerBody1 = document.getElementById('drawerBody1');
const drawerBody2 = document.getElementById('drawerBody2');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let current = 0;

// Build product cards
products.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'product-card';
  card.innerHTML = `
    <div class="card-img" style="background:${p.color};font-size:3.5rem;display:flex;align-items:center;justify-content:center;">${p.emoji}</div>
    <div class="card-body">
      <h3>${p.tag}</h3>
      <span>Tap to explore →</span>
    </div>`;
  card.addEventListener('click', () => openDrawer(i));
  grid.appendChild(card);
});

// Build dots
products.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => goTo(i));
  dotNav.appendChild(dot);
});

function openDrawer(idx) {
  goTo(idx);
  drawer.classList.add('open');
  overlay.classList.add('open');
}

function closeDrawer() {
  drawer.classList.remove('open');
  overlay.classList.remove('open');
}

function goTo(idx) {
  current = (idx + products.length) % products.length;
  const p = products[current];
  drawerImg.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect fill='${encodeURIComponent(p.color)}' width='400' height='300'/><text x='200' y='165' font-size='80' text-anchor='middle' dominant-baseline='middle'>${p.emoji}</text></svg>`;
  drawerTitle.textContent = p.title;
  drawerBody1.textContent = p.body1;
  drawerBody2.textContent = p.body2;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
}

closeBtn.addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
</script>
</body>
</html>
