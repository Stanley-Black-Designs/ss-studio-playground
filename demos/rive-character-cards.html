<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rive Character Cards — SS Studio</title>
<link rel="stylesheet" href="demo-chrome.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/@rive-app/canvas@latest"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #c8c9d1;
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 1.5rem 2rem;
    gap: 2rem;
  }

  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: rgba(0,0,0,0.35);
    text-transform: uppercase;
    font-weight: 500;
  }

  .cards-grid {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 860px;
    width: 100%;
  }

  /* ---- Osmo Rive card styles ---- */
  .rive__canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  [data-rive-status="loaded"] > .rive__canvas {
    opacity: 1;
  }

  .rive-demo-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    width: 26.5em;
    aspect-ratio: 1 / 1.25;
    padding: 2em;
    background-color: #ffffff;
    border-radius: 1.5em;
    box-shadow: 0 24px 60px rgba(0,0,0,0.18);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s;
    cursor: pointer;
    overflow: hidden;
  }

  .rive-demo-card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 40px 80px rgba(0,0,0,0.22);
  }

  .rive-demo-card__tag {
    position: absolute;
    top: 2em;
    left: 2em;
    z-index: 2;
    padding: 0.5em 0.75em;
    font-size: 0.875em;
    line-height: 1;
    background-color: #ece7e8;
    border-radius: 100em;
    font-family: 'DM Sans', system-ui, sans-serif;
  }

  .rive-demo-card__animation {
    position: absolute;
    top: 2em;
    left: 2em;
    right: 2em;
    z-index: 1;
  }

  .rive-demo-card__heading {
    margin: 0px;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 2.5em;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #111;
    position: relative;
    z-index: 3;
  }
</style>
</head>
<body>

<header class="demo-chrome">
  <div class="demo-chrome__left">
    <a href="../index.html" class="demo-chrome__back">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Playground
    </a>
    <span class="demo-chrome__sep"></span>
    <span class="demo-chrome__title">Rive Character Cards</span>
  </div>
  <a href="https://calendly.com/stanleysmithstudios/30min" target="_blank" class="demo-chrome__cta">
    Book a call
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>

<p class="eyebrow">Rive Interactive Animations</p>

<div class="cards-grid">

  <!-- Card 1 — Robot -->
  <div class="rive-demo-card">
    <span class="rive-demo-card__tag">Animation #001</span>
    <div
      data-rive-init
      data-rive-src="https://osmo.b-cdn.net/resource-media/rive-setup-robot.riv"
      class="rive-demo-card__animation"
    ></div>
    <h2 class="rive-demo-card__heading">Robot</h2>
  </div>

  <!-- Card 2 — Marty -->
  <div class="rive-demo-card">
    <span class="rive-demo-card__tag">Animation #002</span>
    <div
      data-rive-init
      data-rive-src="https://osmo.b-cdn.net/resource-media/rive-setup-marty.riv"
      class="rive-demo-card__animation"
    ></div>
    <h2 class="rive-demo-card__heading">Marty</h2>
  </div>

</div>

<script>
gsap.registerPlugin(ScrollTrigger);

function initRiveSetup() {
  const targets = document.querySelectorAll("[data-rive-init]");
  if (!targets.length) return () => {};

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const instances = [];

  targets.forEach((target) => {
    const source = target.getAttribute("data-rive-src");
    if (!source) return;

    const artboardName = target.getAttribute("data-rive-artboard") || undefined;
    const fit = target.getAttribute("data-rive-fit") || "contain";
    let stateMachineName = target.getAttribute("data-rive-state-machine") || undefined;
    let canvas = null;
    let riveFile = null;
    let riveInstance = null;
    let resizeObserver = null;

    if (getComputedStyle(target).position === "static") {
      target.style.position = "relative";
    }

    const scrollTrigger = ScrollTrigger.create({
      trigger: target,
      start: "top bottom+=50%",
      end: "bottom top-=25%",
      onEnter: handleEnter,
      onEnterBack: handleEnter,
      onLeave: handleLeave,
      onLeaveBack: handleLeave,
    });

    function handleEnter() {
      if (!riveFile) {
        loadFile();
      } else if (riveInstance && !reduceMotion) {
        riveInstance.play();
      }
    }

    function handleLeave() {
      if (riveInstance && !reduceMotion) {
        riveInstance.pause();
      }
    }

    function loadFile() {
      target.setAttribute("data-rive-status", "loading");
      canvas = document.createElement("canvas");
      canvas.classList.add("rive__canvas");
      target.appendChild(canvas);

      riveFile = new rive.RiveFile({
        src: source,
        onLoad: createInstance,
        onLoadError: handleError,
      });
      riveFile.init();
    }

    function createInstance() {
      const file = riveFile.getInstance();
      if (!stateMachineName) {
        const artboard = artboardName ? file.artboardByName(artboardName) : file.defaultArtboard();
        if (artboard) {
          if (artboard.stateMachineCount() > 0) {
            stateMachineName = artboard.stateMachineByIndex(0).name;
          }
          artboard.delete();
        }
      }

      riveInstance = new rive.Rive({
        riveFile: riveFile,
        canvas: canvas,
        artboard: artboardName,
        stateMachine: stateMachineName,
        autoplay: !reduceMotion,
        isTouchScrollEnabled: true,
        layout: new rive.Layout({ fit: fit }),
        onLoad: handleLoad,
        onLoadError: handleError,
      });
    }

    function handleLoad() {
      const bounds = riveInstance.bounds;
      if (target.clientHeight === 0 && bounds) {
        target.style.aspectRatio = `${bounds.maxX - bounds.minX} / ${bounds.maxY - bounds.minY}`;
        ScrollTrigger.refresh();
      }
      riveInstance.resizeDrawingSurfaceToCanvas();
      resizeObserver = new ResizeObserver(() => riveInstance.resizeDrawingSurfaceToCanvas());
      resizeObserver.observe(target);
      target.setAttribute("data-rive-status", "loaded");
      if (!scrollTrigger.isActive && !reduceMotion) {
        riveInstance.pause();
      }
    }

    function handleError() {
      target.setAttribute("data-rive-status", "error");
    }

    instances.push({
      destroy() {
        scrollTrigger.kill();
        if (resizeObserver) resizeObserver.disconnect();
        if (riveInstance) riveInstance.cleanup();
        if (riveFile) riveFile.cleanup();
        if (canvas) canvas.remove();
        target.removeAttribute("data-rive-status");
      },
    });
  });

  return () => {
    instances.forEach((instance) => instance.destroy());
  };
}

document.addEventListener("DOMContentLoaded", () => {
  initRiveSetup();
});
</script>
</body>
</html>
