<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globe Gallery — SS Studio</title>
<link rel="stylesheet" href="demo-chrome.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    padding-top: 50px;
    color: #f0f0f2;
  }

  .demo-section {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 50px);
    padding: 2rem;
  }

  .globe-gallery {
    position: relative;
    width: 50em;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    user-select: none;
    -webkit-user-select: none;
  }

  .globe-gallery__collection {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .globe-gallery__list {
    position: absolute;
    inset: 0%;
    display: flex;
    gap: 1em;
  }

  .globe-gallery__item {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 0.5em;
    overflow: hidden;
  }

  .globe-gallery:not([data-globe-gallery-status="active"]) .globe-gallery__item {
    visibility: hidden;
  }

  .globe-gallery__image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media screen and (max-width: 767px) {
    .globe-gallery__list {
      gap: 0.25em;
    }

    .globe-gallery__item {
      border-radius: 0.25em;
    }
  }
</style>
</head>
<body>

<header class="demo-chrome">
  <div class="demo-chrome__left">
    <a href="../index.html" class="demo-chrome__back">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Playground
    </a>
    <span class="demo-chrome__sep"></span>
    <span class="demo-chrome__title">Globe Gallery</span>
  </div>
  <a href="https://calendly.com/stanleysmithstudios/30min" target="_blank" class="demo-chrome__cta">
    Book a call
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>

<section class="demo-section">
  <div data-globe-gallery-init class="globe-gallery">
    <div class="globe-gallery__collection">
      <div data-globe-gallery-list class="globe-gallery__list">
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a1a92eaa6729930945_artisan-bread-stacked-on-minimalist-pedestal-medium.avif" alt="Artisan bread on a pedestal" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a1ab80e537b68335d6_blurred-profile-portrait-in-warm-minimal-light-medium.avif" alt="Blurred profile portrait" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a19119f7aca6c510ce_curly-kale-close-up-in-natural-light-medium.avif" alt="Curly kale close-up" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a105f787b161234c9c_dynamic-jet-engine-in-motion-medium.avif" alt="Jet engine in motion" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a1cb1b33e8cbcab8ae_elegant-espresso-presentation-on-textured-surface-medium.avif" alt="Espresso on a textured surface" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a1b3edd7525e021e26_golden-steel-truss-perspective-medium.avif" alt="Golden steel truss" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a1692aa5041a8135c2_minimalist-bicycle-saddle-close-up-medium.avif" alt="Bicycle saddle close-up" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a12ee54708350d276b_minimalist-black-shapes-on-reflective-surface-medium.avif" alt="Black shapes on a reflective surface" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a12ee54708350d2770_sleek-metallic-detail-with-warm-tones-medium.avif" alt="Metallic detail in warm tones" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb70a1b739d036641600e8_two-camels-in-soft-natural-light-medium.avif" alt="Two camels in soft light" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb7665cb1b33e8cbcf916c_minimal-studio-close-up-of-a-golf-iron-clubhead-medium.avif" alt="Golf iron clubhead" draggable="false" class="globe-gallery__image">
        </div>
        <div data-globe-gallery-item class="globe-gallery__item">
          <img src="https://cdn.prod.website-files.com/6abaeded495ba99631bce89a/6abb766504ea5f3572b43939_dalmatian-midsection-and-tail-against-deep-red-studio-backdrop-medium.avif" alt="Dalmatian against a deep red backdrop" draggable="false" class="globe-gallery__image">
        </div>
      </div>
    </div>
  </div>
</section>

<script>
function initGlobeGallery() {
  document.querySelectorAll("[data-globe-gallery-init]").forEach((root) => {
    const list = root.querySelector("[data-globe-gallery-list]");
    const items = [...root.querySelectorAll("[data-globe-gallery-item]")];
    if (!list || !items.length) return;

    const rows = 7;
    const columns = 18;
    const latitude = 58; // degrees the rows reach above and below the middle, 90 touches the poles
    const staggerRows = true; // shifts every other row by half a card
    const taper = true; // cards narrow towards the top and bottom, false gives every card the same size
    const tilt = 0; // degrees, positive shows more of the top, negative tilts it to show the bottom
    const cameraDistance = 4; // lower gives stronger 3Dfeel
    const idleSpeed = 8; // degrees per second
    const direction = "left"; // "left" | "right"
    const scrollBoost = 0.05; // extra degrees per second for every px per second scrolled
    const maxBoost = 80; // degrees per second
    const boostIn = 4; // how quickly scrolling speeds the globe up, higher is quicker
    const boostOut = 1.2; // how quickly it settles back to idle, higher is quicker
    const edgeOpacity = 0.2; // at the edge of the globe
    const fadeZone = 0.35; // share of the front used to fade towards the edge, 0 to 1
    const backOpacity = 0.1; // at the very back, 0 hides the back of the globe

    const toRadians = Math.PI / 180;
    const band = latitude * toRadians;
    const rowStep = (2 * band) / rows;
    const columnStep = (2 * Math.PI) / columns;
    const rowLatitudes = Array.from({ length: rows }, (_, row) => band - rowStep * (row + 0.5));
    const tiltAngle = tilt * toRadians;
    const sinTilt = Math.sin(-tiltAngle);
    const cosTilt = Math.cos(-tiltAngle);
    const spinDirection = direction === "right" ? 1 : -1;
    let cards = [];
    let radius = 0;
    let halfHeight = 0;
    let spin = 0;
    let boost = 0;
    let scrollDistance = 0;
    let lastScroll = window.scrollY;
    let motionAllowed = true;
    let inView = true;

    function distribute() {
      let seed = 2024;
      const random = () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let value = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value;
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
      const shuffled = () => {
        const deck = [...items.keys()];
        for (let index = deck.length - 1; index > 0; index--) {
          const swap = Math.floor(random() * (index + 1));
          [deck[index], deck[swap]] = [deck[swap], deck[index]];
        }
        return deck;
      };
      const order = [];
      const deck = [];

      for (let slot = 0; slot < rows * columns; slot++) {
        const row = Math.floor(slot / columns);
        const column = slot % columns;
        const neighbours = new Set();
        if (column > 0) neighbours.add(order[slot - 1]);
        if (column === columns - 1) neighbours.add(order[slot - column]);
        if (row > 0) {
          [-1, 0, 1].forEach((shift) => {
            neighbours.add(order[(row - 1) * columns + ((column + shift + columns) % columns)]);
          });
        }
        let pick = deck.findIndex((index) => !neighbours.has(index));
        if (pick < 0) {
          deck.push(...shuffled());
          pick = deck.findIndex((index) => !neighbours.has(index));
        }
        order.push(deck.splice(Math.max(pick, 0), 1)[0]);
      }
      return order;
    }

    function facing(normalZ) {
      return (cameraDistance * normalZ - 1) / Math.sqrt(1 + cameraDistance ** 2 - 2 * cameraDistance * normalZ);
    }

    function ease(value) {
      const progress = Math.min(Math.max(value / Math.max(fadeZone, 0.001), 0), 1);
      return progress * progress * (3 - 2 * progress);
    }

    function build() {
      const placed = new Set();
      cards = distribute().map((index, slot) => {
        const item = items[index];
        let element = item;
        if (placed.has(item)) {
          element = item.cloneNode(true);
          element.setAttribute("aria-hidden", "true");
          element.inert = true;
          list.appendChild(element);
        }
        placed.add(item);
        const row = Math.floor(slot / columns);
        const column = slot % columns;
        const cardLatitude = rowLatitudes[row];
        return {
          element,
          row,
          longitude: columnStep * (column + (staggerRows && row % 2 ? 0.5 : 0)),
          sinLatitude: Math.sin(cardLatitude),
          cosLatitude: Math.cos(cardLatitude),
          frontPeak: Math.max(facing(Math.cos(cardLatitude - tiltAngle)), 0.001),
          backPeak: Math.max(-facing(-Math.cos(cardLatitude + tiltAngle)), 0.001),
        };
      });
      items.forEach((item) => {
        if (!placed.has(item)) item.style.display = "none";
      });
    }

    function layout() {
      const listStyle = getComputedStyle(list);
      const columnGap = parseFloat(listStyle.columnGap) || 0;
      const rowGap = parseFloat(listStyle.rowGap) || 0;
      radius = list.offsetWidth / 2;
      halfHeight = Math.max(radius * Math.tan(rowStep / 2) - rowGap / 2, 0);
      const rowHalfWidths = rowLatitudes.map((rowLatitude) => {
        const widthLatitude = taper ? rowLatitude : rowLatitudes[0];
        return Math.max(radius * Math.cos(widthLatitude) * Math.tan(columnStep / 2) - columnGap / 2, 0);
      });
      list.style.perspective = `${radius * cameraDistance}px`;

      cards.forEach((card) => {
        card.halfWidth = rowHalfWidths[card.row];
        card.element.style.width = `${card.halfWidth * 2}px`;
        card.element.style.height = `${halfHeight * 2}px`;
      });
    }

    function render() {
      cards.forEach((card) => {
        const { element, sinLatitude, cosLatitude } = card;
        const theta = card.longitude + spin;
        const sinTheta = Math.sin(theta);
        const cosTheta = Math.cos(theta);
        const normalX = sinTheta * cosLatitude;
        const normalY = -cosTilt * sinLatitude - sinTilt * cosTheta * cosLatitude;
        const normalZ = cosTilt * cosTheta * cosLatitude - sinTilt * sinLatitude;
        const cardFacing = facing(normalZ);
        const opacity = cardFacing < 0
          ? edgeOpacity + (backOpacity - edgeOpacity) * ease(-cardFacing / card.backPeak)
          : edgeOpacity + (1 - edgeOpacity) * ease(cardFacing / card.frontPeak);
        const visibility = opacity > 0 ? "visible" : "hidden";
        const zIndex = Math.round((normalZ + 1) * 1000);

        if (card.visibility !== visibility) {
          element.style.visibility = visibility;
          card.visibility = visibility;
        }
        if (opacity <= 0) return;
        if (card.zIndex !== zIndex) {
          element.style.zIndex = zIndex;
          card.zIndex = zIndex;
        }
        element.style.opacity = opacity;
        element.style.transform = `matrix3d(${cosTheta},${sinTilt * sinTheta},${-cosTilt * sinTheta},0,${sinTheta * sinLatitude},${cosTilt * cosLatitude - sinTilt * cosTheta * sinLatitude},${sinTilt * cosLatitude + cosTilt * cosTheta * sinLatitude},0,${normalX},${normalY},${normalZ},0,${radius * normalX - card.halfWidth},${radius * normalY - halfHeight},${radius * normalZ},1)`;
      });
    }

    build();
    root.setAttribute("data-globe-gallery-status", "active");

    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY;
      scrollDistance += Math.abs(scrollY - lastScroll);
      lastScroll = scrollY;
    }, { passive: true });

    new ResizeObserver(() => {
      layout();
      render();
    }).observe(list);

    new IntersectionObserver(([entry]) => {
      inView = entry.isIntersecting;
    }).observe(root);

    gsap.matchMedia().add("(prefers-reduced-motion: reduce)", () => {
      motionAllowed = false;
      return () => {
        motionAllowed = true;
      };
    });

    gsap.ticker.add((time, deltaTime) => {
      const seconds = Math.min(deltaTime, 100) / 1000;
      const scrollSpeed = scrollDistance / seconds;
      scrollDistance = 0;
      if (!motionAllowed || !inView) return;

      const target = Math.min(scrollSpeed * scrollBoost, maxBoost);
      const rate = target > boost ? boostIn : boostOut;
      boost += (target - boost) * (1 - Math.exp(-rate * seconds));
      spin += spinDirection * (idleSpeed + boost) * seconds * toRadians;
      render();
    });
  });
}

// Initialize Globe Gallery
document.addEventListener("DOMContentLoaded", () => {
  initGlobeGallery();
});
</script>
</body>
</html>
